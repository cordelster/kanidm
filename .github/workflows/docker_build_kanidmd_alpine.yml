---
name: Container - Kanidmd Alpine / HASSIO

# Builds Alpine 3.23 and edge images, then HASSIO once both Alpine builds succeed.
# Always builds and uploads OCI artifacts; only pushes to GHCR on master or tags.
"on":
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  set_tag_values:
    runs-on: ubuntu-latest
    name: Set image tag values
    steps:
      - id: step1
        run: |
          echo "OWNER_LC=${OWNER,,}" >> "${GITHUB_OUTPUT}"
        env:
          OWNER: '${{ github.repository_owner }}'
      - id: step2
        run: |
          echo "REF_NAME=$(echo ${REF_NAME,,} | awk -F/ '{print $1}')" >> "${GITHUB_OUTPUT}"
        env:
          REF_NAME: '${{ github.ref_name }}'
    outputs:
      owner_lc: ${{ steps.step1.outputs.OWNER_LC }}
      ref_name: ${{ steps.step2.outputs.REF_NAME }}

  alpine_build:
    name: Build kanidmd Alpine ${{ matrix.alpine_version }} image
    runs-on: ubuntu-latest
    needs: set_tag_values
    strategy:
      fail-fast: false
      matrix:
        include:
          - alpine_version: "3.23"
            rust_image: "rust:1-alpine3.23"
          - alpine_version: "edge"
            rust_image: "rust:alpine"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
      - name: Build kanidmd Alpine ${{ matrix.alpine_version }}
        uses: docker/build-push-action@v6
        with:
          platforms: "linux/amd64"
          tags: >-
            ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/kanidmd:alpine-${{ matrix.alpine_version }}-devel,
            ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/kanidmd:alpine-${{ matrix.alpine_version }}-${{ needs.set_tag_values.outputs.ref_name }}
          build-args: |
            RUST_IMAGE=${{ matrix.rust_image }}
            ALPINE_VERSION=${{ matrix.alpine_version }}
          file: server/Dockerfile.alpine
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Must use OCI exporter for multi-arch: https://github.com/docker/buildx/pull/1813
          outputs: type=oci,dest=/tmp/kanidmd-alpine-${{ matrix.alpine_version }}-docker.tar
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: kanidmd-alpine-${{ matrix.alpine_version }}-docker
          path: /tmp/kanidmd-alpine-${{ matrix.alpine_version }}-docker.tar

  hassio_build:
    name: Build kanidmd HASSIO image
    runs-on: ubuntu-latest
    # HASSIO build runs after all Alpine builds succeed
    needs: [set_tag_values, alpine_build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
      - name: Build kanidmd HASSIO
        uses: docker/build-push-action@v6
        with:
          platforms: "linux/amd64"
          tags: >-
            ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/kanidmd:hassio-devel,
            ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/kanidmd:hassio-${{ needs.set_tag_values.outputs.ref_name }}
          build-args: |
            HASSIO_BASE=ghcr.io/home-assistant/amd64-base:latest
          file: server/Dockerfile.hassio
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=oci,dest=/tmp/kanidmd-hassio-docker.tar
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: kanidmd-hassio-docker
          path: /tmp/kanidmd-hassio-docker.tar

  alpine_push:
    name: Push kanidmd Alpine ${{ matrix.alpine_version }} image
    # Split from build so "packages: write" is only applied when actually pushing.
    runs-on: ubuntu-latest
    if: ( github.ref_type == 'tag' || github.ref == 'refs/heads/master' )
    needs: [alpine_build, set_tag_values]
    permissions:
      packages: write
    strategy:
      matrix:
        alpine_version: ["3.23", "edge"]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: kanidmd-alpine-${{ matrix.alpine_version }}-docker
          path: /tmp
      - name: Set up ORAS
        uses: oras-project/setup-oras@v1
      - name: Push image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            oras login -u "${{ github.actor }}" --password-stdin ghcr.io
          oras copy \
            --from-oci-layout "/tmp/kanidmd-alpine-${{ matrix.alpine_version }}-docker.tar:alpine-${{ matrix.alpine_version }}-devel" \
            "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/kanidmd:alpine-${{ matrix.alpine_version }}-devel"

  hassio_push:
    name: Push kanidmd HASSIO image
    runs-on: ubuntu-latest
    if: ( github.ref_type == 'tag' || github.ref == 'refs/heads/master' )
    needs: [hassio_build, set_tag_values]
    permissions:
      packages: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: kanidmd-hassio-docker
          path: /tmp
      - name: Set up ORAS
        uses: oras-project/setup-oras@v1
      - name: Push image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            oras login -u "${{ github.actor }}" --password-stdin ghcr.io
          oras copy \
            --from-oci-layout "/tmp/kanidmd-hassio-docker.tar:hassio-devel" \
            "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/kanidmd:hassio-devel"
