---
name: Container - Alpine / HASSIO (kanidm, kanidmd, radius)

# Builds Alpine 3.23 and edge images for all three services, then HASSIO
# variants once all Alpine builds for that service succeed.
# Always builds and uploads OCI artifacts; only pushes to GHCR on master or tags.
"on":
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  set_tag_values:
    runs-on: ubuntu-latest
    name: Set image tag values
    steps:
      - id: step1
        run: |
          echo "OWNER_LC=${OWNER,,}" >> "${GITHUB_OUTPUT}"
        env:
          OWNER: '${{ github.repository_owner }}'
      - id: step2
        run: |
          echo "REF_NAME=$(echo ${REF_NAME,,} | awk -F/ '{print $1}')" >> "${GITHUB_OUTPUT}"
        env:
          REF_NAME: '${{ github.ref_name }}'
    outputs:
      owner_lc: ${{ steps.step1.outputs.OWNER_LC }}
      ref_name: ${{ steps.step2.outputs.REF_NAME }}

  # ============================================================
  # Alpine builds — all six run in parallel (3 images × 2 versions)
  # ============================================================

  alpine_build:
    name: Build ${{ matrix.image }}:alpine-${{ matrix.alpine_version }}
    runs-on: ubuntu-latest
    needs: set_tag_values
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kanidmd
            alpine_version: "3.23"
            rust_image: "rust:1-alpine3.23"
            dockerfile: server/Dockerfile.alpine
          - image: kanidmd
            alpine_version: "edge"
            rust_image: "rust:alpine"
            dockerfile: server/Dockerfile.alpine
          - image: kanidm
            alpine_version: "3.23"
            rust_image: "rust:1-alpine3.23"
            dockerfile: tools/Dockerfile.alpine
          - image: kanidm
            alpine_version: "edge"
            rust_image: "rust:alpine"
            dockerfile: tools/Dockerfile.alpine
          - image: radius
            alpine_version: "3.23"
            dockerfile: rlm_python/Dockerfile.alpine
          - image: radius
            alpine_version: "edge"
            dockerfile: rlm_python/Dockerfile.alpine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
      - name: Build ${{ matrix.image }} Alpine ${{ matrix.alpine_version }}
        uses: docker/build-push-action@v6
        with:
          platforms: "linux/amd64"
          tags: >-
            ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:alpine-${{ matrix.alpine_version }}-devel,
            ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:alpine-${{ matrix.alpine_version }}-${{ needs.set_tag_values.outputs.ref_name }}
          build-args: |
            RUST_IMAGE=${{ matrix.rust_image }}
            ALPINE_VERSION=${{ matrix.alpine_version }}
          file: ${{ matrix.dockerfile }}
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=oci,dest=/tmp/${{ matrix.image }}-alpine-${{ matrix.alpine_version }}-docker.tar
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.image }}-alpine-${{ matrix.alpine_version }}-docker
          path: /tmp/${{ matrix.image }}-alpine-${{ matrix.alpine_version }}-docker.tar

  # ============================================================
  # HASSIO builds — each starts after both Alpine versions of
  # the same image succeed
  # ============================================================

  hassio_build:
    name: Build ${{ matrix.image }}:hassio
    runs-on: ubuntu-latest
    needs: [set_tag_values, alpine_build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kanidmd
            dockerfile: server/Dockerfile.hassio
            hassio_base: "ghcr.io/home-assistant/amd64-base:latest"
          - image: kanidm
            dockerfile: tools/Dockerfile.hassio
            hassio_base: "ghcr.io/home-assistant/amd64-base:latest"
          - image: radius
            dockerfile: rlm_python/Dockerfile.hassio
            hassio_base: "ghcr.io/home-assistant/amd64-base:latest"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
      - name: Build ${{ matrix.image }} HASSIO
        uses: docker/build-push-action@v6
        with:
          platforms: "linux/amd64"
          tags: >-
            ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:hassio-devel,
            ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:hassio-${{ needs.set_tag_values.outputs.ref_name }}
          build-args: |
            HASSIO_BASE=${{ matrix.hassio_base }}
          file: ${{ matrix.dockerfile }}
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=oci,dest=/tmp/${{ matrix.image }}-hassio-docker.tar
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.image }}-hassio-docker
          path: /tmp/${{ matrix.image }}-hassio-docker.tar

  # ============================================================
  # Push jobs — only on master or tags
  # ============================================================

  alpine_push:
    name: Push ${{ matrix.image }}:alpine-${{ matrix.alpine_version }}
    runs-on: ubuntu-latest
    if: ( github.ref_type == 'tag' || github.ref == 'refs/heads/master' )
    needs: [alpine_build, set_tag_values]
    permissions:
      packages: write
    strategy:
      matrix:
        image: [kanidmd, kanidm, radius]
        alpine_version: ["3.23", "edge"]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.image }}-alpine-${{ matrix.alpine_version }}-docker
          path: /tmp
      - name: Set up ORAS
        uses: oras-project/setup-oras@v1
      - name: Push image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            oras login -u "${{ github.actor }}" --password-stdin ghcr.io
          oras copy \
            --from-oci-layout "/tmp/${{ matrix.image }}-alpine-${{ matrix.alpine_version }}-docker.tar:alpine-${{ matrix.alpine_version }}-devel" \
            "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:alpine-${{ matrix.alpine_version }}-devel"

  hassio_push:
    name: Push ${{ matrix.image }}:hassio
    runs-on: ubuntu-latest
    if: ( github.ref_type == 'tag' || github.ref == 'refs/heads/master' )
    needs: [hassio_build, set_tag_values]
    permissions:
      packages: write
    strategy:
      matrix:
        image: [kanidmd, kanidm, radius]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.image }}-hassio-docker
          path: /tmp
      - name: Set up ORAS
        uses: oras-project/setup-oras@v1
      - name: Push image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            oras login -u "${{ github.actor }}" --password-stdin ghcr.io
          oras copy \
            --from-oci-layout "/tmp/${{ matrix.image }}-hassio-docker.tar:hassio-devel" \
            "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:hassio-devel"
