---
name: Container - Alpine / HASSIO (kanidm, kanidmd, radius)

# Builds Alpine 3.23 and edge images for all three services across amd64
# and arm64 (native runners). HASSIO variants run once all Alpine builds
# for that service succeed. Pushes multi-arch manifests to GHCR on master
# or tags.
"on":
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  set_tag_values:
    runs-on: ubuntu-latest
    name: Set image tag values
    steps:
      - id: step1
        run: |
          echo "OWNER_LC=${OWNER,,}" >> "${GITHUB_OUTPUT}"
        env:
          OWNER: '${{ github.repository_owner }}'
      - id: step2
        run: |
          echo "REF_NAME=$(echo ${REF_NAME,,} | awk -F/ '{print $1}')" >> "${GITHUB_OUTPUT}"
        env:
          REF_NAME: '${{ github.ref_name }}'
    outputs:
      owner_lc: ${{ steps.step1.outputs.OWNER_LC }}
      ref_name: ${{ steps.step2.outputs.REF_NAME }}

  # ============================================================
  # Alpine builds — 12 jobs in parallel (3 images × 2 versions × 2 arches)
  # Each runs on a native runner for its architecture.
  # ============================================================
  alpine_build:
    name: Build ${{ matrix.image }}:alpine-${{ matrix.alpine_version }}-${{ matrix.arch_tag }}
    runs-on: ${{ matrix.runs_on }}
    needs: set_tag_values
    strategy:
      fail-fast: false
      matrix:
        include:
          # kanidmd
          - {image: kanidmd, alpine_version: "3.23", rust_image: "rust:1-alpine3.23", dockerfile: server/Dockerfile.alpine, platform: linux/amd64, runs_on: ubuntu-latest,      arch_tag: amd64}
          - {image: kanidmd, alpine_version: "3.23", rust_image: "rust:1-alpine3.23", dockerfile: server/Dockerfile.alpine, platform: linux/arm64, runs_on: ubuntu-24.04-arm, arch_tag: arm64}
          - {image: kanidmd, alpine_version: "edge",  rust_image: "rust:alpine",        dockerfile: server/Dockerfile.alpine, platform: linux/amd64, runs_on: ubuntu-latest,      arch_tag: amd64}
          - {image: kanidmd, alpine_version: "edge",  rust_image: "rust:alpine",        dockerfile: server/Dockerfile.alpine, platform: linux/arm64, runs_on: ubuntu-24.04-arm, arch_tag: arm64}
          # kanidm
          - {image: kanidm,  alpine_version: "3.23", rust_image: "rust:1-alpine3.23", dockerfile: tools/Dockerfile.alpine,  platform: linux/amd64, runs_on: ubuntu-latest,      arch_tag: amd64}
          - {image: kanidm,  alpine_version: "3.23", rust_image: "rust:1-alpine3.23", dockerfile: tools/Dockerfile.alpine,  platform: linux/arm64, runs_on: ubuntu-24.04-arm, arch_tag: arm64}
          - {image: kanidm,  alpine_version: "edge",  rust_image: "rust:alpine",        dockerfile: tools/Dockerfile.alpine,  platform: linux/amd64, runs_on: ubuntu-latest,      arch_tag: amd64}
          - {image: kanidm,  alpine_version: "edge",  rust_image: "rust:alpine",        dockerfile: tools/Dockerfile.alpine,  platform: linux/arm64, runs_on: ubuntu-24.04-arm, arch_tag: arm64}
          # radius (no Rust build, no rust_image needed)
          - {image: radius,  alpine_version: "3.23", dockerfile: rlm_python/Dockerfile.alpine, platform: linux/amd64, runs_on: ubuntu-latest,      arch_tag: amd64}
          - {image: radius,  alpine_version: "3.23", dockerfile: rlm_python/Dockerfile.alpine, platform: linux/arm64, runs_on: ubuntu-24.04-arm, arch_tag: arm64}
          - {image: radius,  alpine_version: "edge",  dockerfile: rlm_python/Dockerfile.alpine, platform: linux/amd64, runs_on: ubuntu-latest,      arch_tag: amd64}
          - {image: radius,  alpine_version: "edge",  dockerfile: rlm_python/Dockerfile.alpine, platform: linux/arm64, runs_on: ubuntu-24.04-arm, arch_tag: arm64}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
      - name: Build ${{ matrix.image }} alpine-${{ matrix.alpine_version }}-${{ matrix.arch_tag }}
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          tags: >-
            ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:alpine-${{ matrix.alpine_version }}-${{ matrix.arch_tag }}-devel,
            ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:alpine-${{ matrix.alpine_version }}-${{ matrix.arch_tag }}-${{ needs.set_tag_values.outputs.ref_name }}
          build-args: |
            RUST_IMAGE=${{ matrix.rust_image }}
            ALPINE_VERSION=${{ matrix.alpine_version }}
          file: ${{ matrix.dockerfile }}
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}-alpine-${{ matrix.alpine_version }}-${{ matrix.arch_tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-alpine-${{ matrix.alpine_version }}-${{ matrix.arch_tag }}
          outputs: type=oci,dest=/tmp/${{ matrix.image }}-alpine-${{ matrix.alpine_version }}-${{ matrix.arch_tag }}-docker.tar
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.image }}-alpine-${{ matrix.alpine_version }}-${{ matrix.arch_tag }}-docker
          path: /tmp/${{ matrix.image }}-alpine-${{ matrix.alpine_version }}-${{ matrix.arch_tag }}-docker.tar

  # ============================================================
  # HASSIO builds — 6 jobs (3 images × 2 arches), native runners.
  # Starts only after ALL Alpine builds succeed.
  # amd64 uses amd64-base, arm64 uses aarch64-base.
  # ============================================================
  hassio_build:
    name: Build ${{ matrix.image }}:hassio-${{ matrix.arch_tag }}
    runs-on: ${{ matrix.runs_on }}
    needs: [set_tag_values, alpine_build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: kanidmd, platform: linux/amd64, runs_on: ubuntu-latest,      arch_tag: amd64, hassio_base: "ghcr.io/home-assistant/amd64-base:latest",    rust_image: "rust:1-alpine3.23", dockerfile: server/Dockerfile.hassio}
          - {image: kanidmd, platform: linux/arm64, runs_on: ubuntu-24.04-arm, arch_tag: arm64, hassio_base: "ghcr.io/home-assistant/aarch64-base:latest", rust_image: "rust:1-alpine3.23", dockerfile: server/Dockerfile.hassio}
          - {image: kanidm,  platform: linux/amd64, runs_on: ubuntu-latest,      arch_tag: amd64, hassio_base: "ghcr.io/home-assistant/amd64-base:latest",    rust_image: "rust:1-alpine3.23", dockerfile: tools/Dockerfile.hassio}
          - {image: kanidm,  platform: linux/arm64, runs_on: ubuntu-24.04-arm, arch_tag: arm64, hassio_base: "ghcr.io/home-assistant/aarch64-base:latest", rust_image: "rust:1-alpine3.23", dockerfile: tools/Dockerfile.hassio}
          - {image: radius,  platform: linux/amd64, runs_on: ubuntu-latest,      arch_tag: amd64, hassio_base: "ghcr.io/home-assistant/amd64-base:latest",    dockerfile: rlm_python/Dockerfile.hassio}
          - {image: radius,  platform: linux/arm64, runs_on: ubuntu-24.04-arm, arch_tag: arm64, hassio_base: "ghcr.io/home-assistant/aarch64-base:latest", dockerfile: rlm_python/Dockerfile.hassio}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
      - name: Build ${{ matrix.image }} hassio-${{ matrix.arch_tag }}
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          tags: >-
            ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:hassio-${{ matrix.arch_tag }}-devel,
            ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:hassio-${{ matrix.arch_tag }}-${{ needs.set_tag_values.outputs.ref_name }}
          build-args: |
            RUST_IMAGE=${{ matrix.rust_image }}
            HASSIO_BASE=${{ matrix.hassio_base }}
          file: ${{ matrix.dockerfile }}
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}-hassio-${{ matrix.arch_tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-hassio-${{ matrix.arch_tag }}
          outputs: type=oci,dest=/tmp/${{ matrix.image }}-hassio-${{ matrix.arch_tag }}-docker.tar
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.image }}-hassio-${{ matrix.arch_tag }}-docker
          path: /tmp/${{ matrix.image }}-hassio-${{ matrix.arch_tag }}-docker.tar

  # ============================================================
  # Push jobs — only on master or tags.
  # Downloads both arch artifacts, pushes each with an arch tag,
  # then merges into a single multi-arch manifest.
  # ============================================================
  alpine_push:
    name: Push ${{ matrix.image }}:alpine-${{ matrix.alpine_version }} (multi-arch)
    runs-on: ubuntu-latest
    if: ( github.ref_type == 'tag' || github.ref == 'refs/heads/master' )
    needs: [alpine_build, set_tag_values]
    permissions:
      packages: write
    strategy:
      matrix:
        image: [kanidmd, kanidm, radius]
        alpine_version: ["3.23", "edge"]
    steps:
      - name: Download amd64 artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.image }}-alpine-${{ matrix.alpine_version }}-amd64-docker
          path: /tmp
      - name: Download arm64 artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.image }}-alpine-${{ matrix.alpine_version }}-arm64-docker
          path: /tmp
      - name: Set up ORAS
        uses: oras-project/setup-oras@v1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Push arch-specific images to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            oras login -u "${{ github.actor }}" --password-stdin ghcr.io
          oras copy \
            --from-oci-layout "/tmp/${{ matrix.image }}-alpine-${{ matrix.alpine_version }}-amd64-docker.tar:alpine-${{ matrix.alpine_version }}-amd64-devel" \
            "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:alpine-${{ matrix.alpine_version }}-amd64-devel"
          oras copy \
            --from-oci-layout "/tmp/${{ matrix.image }}-alpine-${{ matrix.alpine_version }}-arm64-docker.tar:alpine-${{ matrix.alpine_version }}-arm64-devel" \
            "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:alpine-${{ matrix.alpine_version }}-arm64-devel"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            oras copy \
              --from-oci-layout "/tmp/${{ matrix.image }}-alpine-${{ matrix.alpine_version }}-amd64-docker.tar:alpine-${{ matrix.alpine_version }}-amd64-${{ needs.set_tag_values.outputs.ref_name }}" \
              "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:alpine-${{ matrix.alpine_version }}-amd64-${{ needs.set_tag_values.outputs.ref_name }}"
            oras copy \
              --from-oci-layout "/tmp/${{ matrix.image }}-alpine-${{ matrix.alpine_version }}-arm64-docker.tar:alpine-${{ matrix.alpine_version }}-arm64-${{ needs.set_tag_values.outputs.ref_name }}" \
              "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:alpine-${{ matrix.alpine_version }}-arm64-${{ needs.set_tag_values.outputs.ref_name }}"
          fi
      - name: Merge into multi-arch manifest
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login -u "${{ github.actor }}" --password-stdin ghcr.io
          docker buildx imagetools create \
            -t "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:alpine-${{ matrix.alpine_version }}-devel" \
            "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:alpine-${{ matrix.alpine_version }}-amd64-devel" \
            "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:alpine-${{ matrix.alpine_version }}-arm64-devel"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker buildx imagetools create \
              -t "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:alpine-${{ matrix.alpine_version }}-${{ needs.set_tag_values.outputs.ref_name }}" \
              "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:alpine-${{ matrix.alpine_version }}-amd64-${{ needs.set_tag_values.outputs.ref_name }}" \
              "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:alpine-${{ matrix.alpine_version }}-arm64-${{ needs.set_tag_values.outputs.ref_name }}"
          fi

  hassio_push:
    name: Push ${{ matrix.image }}:hassio (multi-arch)
    runs-on: ubuntu-latest
    if: ( github.ref_type == 'tag' || github.ref == 'refs/heads/master' )
    needs: [hassio_build, set_tag_values]
    permissions:
      packages: write
    strategy:
      matrix:
        image: [kanidmd, kanidm, radius]
    steps:
      - name: Download amd64 artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.image }}-hassio-amd64-docker
          path: /tmp
      - name: Download arm64 artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.image }}-hassio-arm64-docker
          path: /tmp
      - name: Set up ORAS
        uses: oras-project/setup-oras@v1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Push arch-specific images to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            oras login -u "${{ github.actor }}" --password-stdin ghcr.io
          oras copy \
            --from-oci-layout "/tmp/${{ matrix.image }}-hassio-amd64-docker.tar:hassio-amd64-devel" \
            "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:hassio-amd64-devel"
          oras copy \
            --from-oci-layout "/tmp/${{ matrix.image }}-hassio-arm64-docker.tar:hassio-arm64-devel" \
            "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:hassio-arm64-devel"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            oras copy \
              --from-oci-layout "/tmp/${{ matrix.image }}-hassio-amd64-docker.tar:hassio-amd64-${{ needs.set_tag_values.outputs.ref_name }}" \
              "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:hassio-amd64-${{ needs.set_tag_values.outputs.ref_name }}"
            oras copy \
              --from-oci-layout "/tmp/${{ matrix.image }}-hassio-arm64-docker.tar:hassio-arm64-${{ needs.set_tag_values.outputs.ref_name }}" \
              "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:hassio-arm64-${{ needs.set_tag_values.outputs.ref_name }}"
          fi
      - name: Merge into multi-arch manifest
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login -u "${{ github.actor }}" --password-stdin ghcr.io
          docker buildx imagetools create \
            -t "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:hassio-devel" \
            "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:hassio-amd64-devel" \
            "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:hassio-arm64-devel"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker buildx imagetools create \
              -t "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:hassio-${{ needs.set_tag_values.outputs.ref_name }}" \
              "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:hassio-amd64-${{ needs.set_tag_values.outputs.ref_name }}" \
              "ghcr.io/${{ needs.set_tag_values.outputs.owner_lc }}/${{ matrix.image }}:hassio-arm64-${{ needs.set_tag_values.outputs.ref_name }}"
          fi
